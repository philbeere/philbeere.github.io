<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immobilien Kalkulationstool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-900">

    <header class="fixed top-0 w-full bg-white shadow-md z-50 p-4">
        <div class="flex rounded-lg bg-gray-200 p-1">
            <button id="btnObjekt" onclick="showTab('Objekt')" class="flex-1 py-2 rounded-md font-semibold bg-white shadow">Objekt</button>
            <button id="btnFinanzierung" onclick="showTab('Finanzierung')" class="flex-1 py-2 rounded-md font-semibold">Finanzierung</button>
        </div>
    </header>

    <main id="mainContent" class="pt-[90px] px-4 pb-[250px] space-y-6">
    </main>

    <footer id="footerResult" class="fixed bottom-0 w-full bg-white border-t p-4 shadow-lg z-40">
        <div id="results" class="grid grid-cols-2 gap-4 text-sm">
        </div>
    </footer>

    <script>
        const state = {
            activeTab: 'Objekt',
            Objekt: {
                objekttyp: 'Wohnung(WE)',
                kaufpreis: 300000,
                baujahr: 2000,
                preisspiegel: 3000,
                mietspiegel: 12,
                mietstatus: 'vermietet',
                wohnflaeche: 80,
                jahreskaltmiete: 9600,
                stellplaetze: 1,
                stellplatzmiete: 50
            }
        };

        function formatNumber(num) {
            return num.toLocaleString('de-DE', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
        }

        // Hilfsfunktion zur Formatierung bei Eingabe
        function handleInput(key, value) {
            const cleanValue = Number(value.replace(/\./g, ''));
            state.Objekt[key] = cleanValue;
            updateResults();
        }

        function updateResults() {
            const data = state.Objekt;
            const kaufpreis = data.kaufpreis || 0;
            const wohnflaeche = data.wohnflaeche || 1;
            const jahreskaltmiete = data.jahreskaltmiete || 0;
            const stellplatzMieteGesamt = data.stellplaetze * data.stellplatzmiete * 12;
            const jahreskaltmieteGesamt = jahreskaltmiete + stellplatzMieteGesamt;
            const kaufpreisProM2 = wohnflaeche > 0 ? kaufpreis / wohnflaeche : 0;
            
            const results = `
                <div><label class="block text-gray-500">Kaufpreis pro m²</label><b>${formatNumber(kaufpreisProM2)} €/m²</b></div>
                <div><label class="block text-gray-500">Preisspiegelabweichung</label><b>${data.preisspiegel > 0 ? formatNumber((kaufpreisProM2/data.preisspiegel)*100) : 0} %</b></div>
                <div><label class="block text-gray-500">Jahreskaltmiete gesamt</label><b>${formatNumber(jahreskaltmieteGesamt)} €</b></div>
                <div><label class="block text-gray-500">Mietspiegelabweichung</label><b>${(data.mietspiegel > 0 && wohnflaeche > 0) ? formatNumber(((jahreskaltmiete/(12*wohnflaeche))/data.mietspiegel)*100) : 0} %</b></div>
                <div><label class="block text-gray-500">Bruttomietrendite</label><b>${kaufpreis > 0 ? formatNumber((jahreskaltmiete/kaufpreis)*100) : 0} %</b></div>
                <div><label class="block text-gray-500">Bruttomietrendite (inkl. Stellp.)</label><b>${kaufpreis > 0 ? formatNumber((jahreskaltmieteGesamt/kaufpreis)*100) : 0} %</b></div>
            `;
            document.getElementById('results').innerHTML = results;
        }

        function createInput(label, key, unit) {
            return `
                <div class="flex-1">
                    <label class="block text-xs font-medium text-gray-700 mb-1">${label}</label>
                    <div class="relative">
                        <input type="text" class="w-full p-2 border rounded-lg pr-12" value="${state.Objekt[key].toLocaleString('de-DE')}" oninput="this.value = this.value.replace(/[^0-9]/g, ''); handleInput('${key}', this.value)">
                        <span class="absolute right-3 top-2 text-gray-400 text-sm pointer-events-none">${unit}</span>
                    </div>
                </div>
            `;
        }

        function showTab(tab) {
            state.activeTab = tab;
            document.getElementById('btnObjekt').className = tab === 'Objekt' ? 'flex-1 py-2 rounded-md font-semibold bg-white shadow' : 'flex-1 py-2 rounded-md font-semibold';
            document.getElementById('btnFinanzierung').className = tab === 'Finanzierung' ? 'flex-1 py-2 rounded-md font-semibold bg-white shadow' : 'flex-1 py-2 rounded-md font-semibold';
            
            if(tab === 'Objekt') renderObjekt();
            else document.getElementById('mainContent').innerHTML = '<p class="text-center mt-10">Finanzierung Maske in Entwicklung...</p>';
            updateResults();
        }

        function renderObjekt() {
            const container = document.getElementById('mainContent');
            container.innerHTML = `
                <div class="flex gap-4">
                    <div class="flex-1"><label class="block text-xs font-medium text-gray-700 mb-1">Objekttyp</label><select class="w-full p-2 border rounded-lg" onchange="state.Objekt.objekttyp=this.value"><option>Wohnung(WE)</option><option>Mehrfamilienhaus (MFH)</option></select></div>
                    ${createInput("Kaufpreis", "kaufpreis", "€")}
                </div>
                <div class="flex gap-2">
                    ${createInput("Baujahr", "baujahr", "")}
                    ${createInput("Preisspiegel", "preisspiegel", "€/m²")}
                    ${createInput("Mietspiegel", "mietspiegel", "€/m²")}
                </div>
                <div class="flex gap-2">
                    <div class="flex-1"><label class="block text-xs font-medium text-gray-700 mb-1">Mietstatus</label><select class="w-full p-2 border rounded-lg" onchange="state.Objekt.mietstatus=this.value"><option>vermietet</option><option>Leerstand</option></select></div>
                    ${createInput("Wohnfläche", "wohnflaeche", "m²")}
                    ${createInput("Jahreskaltmiete", "jahreskaltmiete", "€")}
                </div>
                <div class="flex gap-4">
                    ${createInput("Stellplätze & Garagen", "stellplaetze", "Stk.")}
                    ${createInput("Stellplatzmiete", "stellplatzmiete", "€ mtl.")}
                </div>
            `;
        }

        showTab('Objekt');
    </script>
</body>
</html>
