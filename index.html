<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immobilien Kalkulationstool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-900">

    <!-- Kopfteil -->
    <header class="fixed top-0 w-full bg-white shadow-md z-50 p-4">
        <div class="flex rounded-lg bg-gray-200 p-1">
            <button id="btnObjekt" onclick="showTab('Objekt')" class="flex-1 py-2 rounded-md font-semibold bg-white shadow">Objekt</button>
            <button id="btnFinanzierung" onclick="showTab('Finanzierung')" class="flex-1 py-2 rounded-md font-semibold">Finanzierung</button>
        </div>
    </header>

    <!-- Hauptteil -->
    <main id="mainContent" class="pt-[90px] px-4 pb-[250px] space-y-6">
        <!-- Inhalte werden per JS geladen -->
    </main>

    <!-- Ergebnisfeld -->
    <footer id="footerResult" class="fixed bottom-0 w-full bg-white border-t p-4 shadow-lg z-40">
        <div id="results" class="grid grid-cols-2 gap-4 text-sm">
            <!-- Ergebnisse kommen hierhin -->
        </div>
    </footer>

    <script>
        const state = {
            activeTab: 'Objekt',
            Objekt: {
                objekttyp: 'Wohnung(WE)',
                kaufpreis: 300000,
                baujahr: 2000,
                preisspiegel: 3000,
                mietspiegel: 12,
                mietstatus: 'vermietet',
                wohnflaeche: 80,
                jahreskaltmiete: 9600,
                stellplaetze: 1,
                stellplatzmiete: 50
            }
        };

        function formatNumber(num) {
            return num.toLocaleString('de-DE', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
        }

        function updateResults() {
            const data = state.Objekt;
            const kaufpreis = data.kaufpreis || 0;
            const wohnflaeche = data.wohnflaeche || 1;
            const jahreskaltmiete = data.jahreskaltmiete || 0;
            const stellplatzMieteGesamt = data.stellplaetze * data.stellplatzmiete * 12;
            const jahreskaltmieteGesamt = jahreskaltmiete + stellplatzMieteGesamt;
            const kaufpreisProM2 = kaufpreis / wohnflaeche;
            
            const results = `
                <div><label class="block text-gray-500">Kaufpreis pro m²</label><b>${formatNumber(kaufpreisProM2)} €/m²</b></div>
                <div><label class="block text-gray-500">Preisspiegelabweichung</label><b>${formatNumber((kaufpreisProM2/data.preisspiegel)*100)} %</b></div>
                <div><label class="block text-gray-500">Jahreskaltmiete gesamt</label><b>${formatNumber(jahreskaltmieteGesamt)} €</b></div>
                <div><label class="block text-gray-500">Mietspiegelabweichung</label><b>${formatNumber((jahreskaltmiete/(12*wohnflaeche))/data.mietspiegel*100)} %</b></div>
                <div><label class="block text-gray-500">Bruttomietrendite</label><b>${formatNumber((jahreskaltmiete/kaufpreis)*100)} %</b></div>
                <div><label class="block text-gray-500">Bruttomietrendite (inkl. Stellp.)</label><b>${formatNumber((jahreskaltmieteGesamt/kaufpreis)*100)} %</b></div>
            `;
            document.getElementById('results').innerHTML = results;
        }

        function showTab(tab) {
            state.activeTab = tab;
            document.getElementById('btnObjekt').className = tab === 'Objekt' ? 'flex-1 py-2 rounded-md font-semibold bg-white shadow' : 'flex-1 py-2 rounded-md font-semibold';
            document.getElementById('btnFinanzierung').className = tab === 'Finanzierung' ? 'flex-1 py-2 rounded-md font-semibold bg-white shadow' : 'flex-1 py-2 rounded-md font-semibold';
            
            if(tab === 'Objekt') renderObjekt();
            else document.getElementById('mainContent').innerHTML = '<p class="text-center">Finanzierung Maske in Entwicklung...</p>';
            updateResults();
        }

        function renderObjekt() {
            const container = document.getElementById('mainContent');
            container.innerHTML = `
                <div class="grid grid-cols-2 gap-4">
                    <div><label>Objekttyp</label><select class="w-full p-2 border rounded-lg" onchange="state.Objekt.objekttyp=this.value"><option>Wohnung(WE)</option><option>Mehrfamilienhaus (MFH)</option></select></div>
                    <div><label>Kaufpreis (€)</label><input type="number" class="w-full p-2 border rounded-lg" value="${state.Objekt.kaufpreis}" oninput="state.Objekt.kaufpreis=Number(this.value); updateResults()"></div>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div><label>Baujahr</label><input type="number" class="w-full p-2 border rounded-lg" value="${state.Objekt.baujahr}" oninput="state.Objekt.baujahr=Number(this.value)"></div>
                    <div><label>Preisspiegel (€/m²)</label><input type="number" class="w-full p-2 border rounded-lg" value="${state.Objekt.preisspiegel}" oninput="state.Objekt.preisspiegel=Number(this.value); updateResults()"></div>
                    <div><label>Mietspiegel (€/m²)</label><input type="number" class="w-full p-2 border rounded-lg" value="${state.Objekt.mietspiegel}" oninput="state.Objekt.mietspiegel=Number(this.value); updateResults()"></div>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div><label>Mietstatus</label><select class="w-full p-2 border rounded-lg" onchange="state.Objekt.mietstatus=this.value"><option>vermietet</option><option>Leerstand</option></select></div>
                    <div><label>Wohnfläche (m²)</label><input type="number" class="w-full p-2 border rounded-lg" value="${state.Objekt.wohnflaeche}" oninput="state.Objekt.wohnflaeche=Number(this.value); updateResults()"></div>
                    <div><label>Jahreskaltmiete (€)</label><input type="number" class="w-full p-2 border rounded-lg" value="${state.Objekt.jahreskaltmiete}" oninput="state.Objekt.jahreskaltmiete=Number(this.value); updateResults()"></div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label>Stellplätze (Stk.)</label><input type="number" class="w-full p-2 border rounded-lg" value="${state.Objekt.stellplaetze}" oninput="state.Objekt.stellplaetze=Number(this.value); updateResults()"></div>
                    <div><label>Stellplatzmiete (€ mtl.)</label><input type="number" class="w-full p-2 border rounded-lg" value="${state.Objekt.stellplatzmiete}" oninput="state.Objekt.stellplatzmiete=Number(this.value); updateResults()"></div>
                </div>
            `;
        }

        showTab('Objekt');
    </script>
</body>
</html>
