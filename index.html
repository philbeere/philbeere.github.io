<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Immobilien-Kalkulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .fixed-top { position: fixed; top: 0; width: 100%; z-index: 50; background: white; }
        .fixed-bottom { position: fixed; bottom: 0; width: 100%; z-index: 50; }
        .content-scroll { margin-top: 80px; margin-bottom: 100px; padding: 1rem; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <div class="fixed-top shadow-sm p-4 border-b">
        <div class="flex bg-gray-200 p-1 rounded-xl">
            <button id="tab-objekt" onclick="switchTab('objekt')" class="flex-1 py-2 rounded-lg font-semibold bg-white shadow">Objekt</button>
            <button id="tab-finanzierung" onclick="switchTab('finanzierung')" class="flex-1 py-2 rounded-lg font-semibold">Finanzierung</button>
        </div>
    </div>

    <div id="main-content" class="content-scroll">
        <div id="view-objekt">
            <div class="mb-6">
                <label class="block text-sm font-medium mb-1">Kaufpreis</label>
                <div class="relative flex items-center">
                    <input type="text" id="kaufpreis" oninput="formatAndCalc(this)" class="w-full p-4 rounded-2xl border shadow-sm outline-none pr-12 text-right text-lg" placeholder="0">
                    <span class="absolute right-4 text-gray-500">€</span>
                </div>
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium mb-1">Wohnfläche</label>
                <div class="relative flex items-center">
                    <input type="text" id="wohnflaeche" oninput="formatAndCalc(this)" class="w-full p-4 rounded-2xl border shadow-sm outline-none pr-12 text-right text-lg" placeholder="0">
                    <span class="absolute right-4 text-gray-500">m²</span>
                </div>
            </div>
        </div>

        <div id="view-finanzierung" class="hidden">
            <p class="text-center text-gray-500 py-10">Bereich für Finanzierung in Arbeit.</p>
        </div>
    </div>

    <div class="fixed-bottom bg-blue-600 text-white p-6 rounded-t-3xl shadow-lg">
        <div class="flex justify-between items-center">
            <span class="text-lg font-medium">Kaufpreis pro m²</span>
            <span class="text-2xl font-bold"><span id="result-price">0</span> €/m²</span>
        </div>
    </div>

    <script>
        function formatAndCalc(input) {
            let val = input.value.replace(/\D/g, '');
            input.value = val.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
            calculate();
        }

        function switchTab(tab) {
            document.getElementById('tab-objekt').className = tab === 'objekt' ? 'flex-1 py-2 rounded-lg font-semibold bg-white shadow' : 'flex-1 py-2 rounded-lg font-semibold';
            document.getElementById('tab-finanzierung').className = tab === 'finanzierung' ? 'flex-1 py-2 rounded-lg font-semibold bg-white shadow' : 'flex-1 py-2 rounded-lg font-semibold';
            document.getElementById('view-objekt').classList.toggle('hidden', tab !== 'objekt');
            document.getElementById('view-finanzierung').classList.toggle('hidden', tab !== 'finanzierung');
        }

        function calculate() {
            const kaufpreis = parseFloat(document.getElementById('kaufpreis').value.replace(/\./g, '')) || 0;
            const wohnflaeche = parseFloat(document.getElementById('wohnflaeche').value.replace(/\./g, '')) || 0;
            const result = wohnflaeche > 0 ? (kaufpreis / wohnflaeche) : 0;
            document.getElementById('result-price').innerText = Math.round(result).toLocaleString('de-DE');
        }
    </script>
</body>
</html>
