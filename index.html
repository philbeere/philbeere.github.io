<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Immobilien Kalkulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: sans-serif; }
        .fixed-header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; }
        .fixed-footer { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; }
        .content-padding { padding-top: 4rem; padding-bottom: 8rem; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <!-- Kopfteil -->
    <header class="fixed-header bg-white shadow-md p-2 flex border-b border-gray-200">
        <button id="btn-objekt" class="flex-1 py-2 font-bold text-blue-600 border-b-2 border-blue-600">Objekt</button>
        <button id="btn-finanzierung" class="flex-1 py-2 font-semibold text-gray-500">Finanzierung</button>
    </header>

    <!-- Hauptteil -->
    <main class="content-padding p-4">
        <div id="view-objekt">
            <div class="grid grid-cols-2 gap-4">
                <div class="col-span-1">
                    <label class="block text-sm font-medium mb-1">Objekttyp</label>
                    <select id="objekttyp" class="w-full p-2 rounded-full border border-gray-300">
                        <option>Wohnung (WE)</option>
                        <option>Mehrfamilienhaus (MFH)</option>
                    </select>
                </div>
                <div class="col-span-1">
                    <label class="block text-sm font-medium mb-1">Kaufpreis (€)</label>
                    <input type="number" id="kaufpreis" class="w-full p-2 rounded-full border border-gray-300" placeholder="0">
                </div>
            </div>
            
            <div class="grid grid-cols-3 gap-4 mt-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Baujahr</label>
                    <input type="number" id="baujahr" class="w-full p-2 rounded-full border border-gray-300">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Preisspiegel (€/m²)</label>
                    <input type="number" id="preisspiegel" class="w-full p-2 rounded-full border border-gray-300">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Mietspiegel (€/m²)</label>
                    <input type="number" id="mietspiegel" class="w-full p-2 rounded-full border border-gray-300">
                </div>
            </div>

            <div class="grid grid-cols-3 gap-4 mt-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Mietstatus</label>
                    <select id="mietstatus" class="w-full p-2 rounded-full border border-gray-300">
                        <option>vermietet</option>
                        <option>Leerstand</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Wohnfläche (m²)</label>
                    <input type="number" id="wohnflaeche" class="w-full p-2 rounded-full border border-gray-300">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Jahreskaltmiete (€)</label>
                    <input type="number" id="jahreskaltmiete" class="w-full p-2 rounded-full border border-gray-300">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mt-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Stellplätze (Stk.)</label>
                    <input type="number" id="stellplaetze" class="w-full p-2 rounded-full border border-gray-300">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Stellplatzmiete (€ mtl.)</label>
                    <input type="number" id="stellplatzmiete" class="w-full p-2 rounded-full border border-gray-300">
                </div>
            </div>
        </div>

        <div id="view-finanzierung" class="hidden">
            <p class="text-center text-gray-500 py-10">Hier folgen die Felder für den Reiter Finanzierung.</p>
        </div>
    </main>

    <!-- Ergebnisfeld -->
    <footer class="fixed-footer bg-white shadow-t border-t border-gray-200 p-4">
        <div id="result-objekt" class="grid grid-cols-2 gap-4 text-center">
            <div class="bg-blue-50 p-3 rounded-lg">
                <p class="text-xs text-gray-600">Kaufpreis pro m²</p>
                <p id="res-kpm2" class="text-lg font-bold text-blue-700">0 €/m²</p>
            </div>
            <div class="bg-blue-50 p-3 rounded-lg">
                <p class="text-xs text-gray-600">Jahreskaltmiete gesamt</p>
                <p id="res-mietegesamt" class="text-lg font-bold text-blue-700">0 €</p>
            </div>
        </div>
    </footer>

    <script>
        // Logik für Reiter-Wechsel
        const btnObjekt = document.getElementById('btn-objekt');
        const btnFin = document.getElementById('btn-finanzierung');
        const viewObjekt = document.getElementById('view-objekt');
        const viewFin = document.getElementById('view-finanzierung');
        const resObjekt = document.getElementById('result-objekt');

        btnObjekt.addEventListener('click', () => {
            viewObjekt.classList.remove('hidden');
            viewFin.classList.add('hidden');
            resObjekt.classList.remove('hidden');
            btnObjekt.className = "flex-1 py-2 font-bold text-blue-600 border-b-2 border-blue-600";
            btnFin.className = "flex-1 py-2 font-semibold text-gray-500";
        });

        btnFin.addEventListener('click', () => {
            viewObjekt.classList.add('hidden');
            viewFin.classList.remove('hidden');
            resObjekt.classList.add('hidden');
            btnFin.className = "flex-1 py-2 font-bold text-blue-600 border-b-2 border-blue-600";
            btnObjekt.className = "flex-1 py-2 font-semibold text-gray-500";
        });

        // Berechnungslogik
        const inputs = ['kaufpreis', 'wohnflaeche', 'jahreskaltmiete', 'stellplaetze', 'stellplatzmiete'];
        inputs.forEach(id => {
            document.getElementById(id).addEventListener('input', calculate);
        });

        function calculate() {
            const kaufpreis = parseFloat(document.getElementById('kaufpreis').value) || 0;
            const wohnflaeche = parseFloat(document.getElementById('wohnflaeche').value) || 0;
            const jahreskaltmiete = parseFloat(document.getElementById('jahreskaltmiete').value) || 0;
            const stellplaetze = parseFloat(document.getElementById('stellplaetze').value) || 0;
            const stellplatzmiete = parseFloat(document.getElementById('stellplatzmiete').value) || 0;

            // Formeln
            const kpm2 = wohnflaeche > 0 ? (kaufpreis / wohnflaeche) : 0;
            const mietegesamt = jahreskaltmiete + (stellplaetze * stellplatzmiete * 12);

            // Ausgabe mit Tausenderpunkten
            document.getElementById('res-kpm2').innerText = kpm2.toLocaleString('de-DE', {maximumFractionDigits: 2}) + " €/m²";
            document.getElementById('res-mietegesamt').innerText = mietegesamt.toLocaleString('de-DE') + " €";
        }
    </script>
</body>
</html>
