<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immobilien-Kalkulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .input-group { position: relative; }
        .unit-label { position: absolute; right: 10px; top: 38px; color: #6b7280; font-size: 0.875rem; pointer-events: none; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <header class="fixed top-0 w-full bg-white shadow-md z-50 p-4">
        <div class="flex gap-2 overflow-x-auto pb-1" id="tab-buttons">
            <button onclick="showTab('Objekt')" class="tab-btn px-4 py-2 bg-blue-600 text-white rounded-lg whitespace-nowrap">Objekt</button>
            <button onclick="showTab('Anschaffungskosten')" class="tab-btn px-4 py-2 bg-gray-200 rounded-lg whitespace-nowrap">Anschaffungskosten</button>
            <button onclick="showTab('Finanzierung')" class="tab-btn px-4 py-2 bg-gray-200 rounded-lg whitespace-nowrap">Finanzierung</button>
            <button onclick="showTab('Rendite')" class="tab-btn px-4 py-2 bg-gray-200 rounded-lg whitespace-nowrap">Rendite</button>
        </div>
    </header>

    <main class="pt-[90px] px-4 pb-[250px] space-y-6">
        <!-- REITER: OBJEKT -->
        <div id="tab-Objekt" class="tab-content active">
            <div class="grid grid-cols-2 gap-4">
                <div><label class="block text-sm">Objekttyp</label><select id="objekttyp" onchange="calc()" class="w-full p-3 rounded-xl border"><option value="WE">Wohnung (WE)</option><option value="MFH">Mehrfamilienhaus (MFH)</option></select></div>
                <div class="input-group"><label class="block text-sm">Kaufpreis</label><input type="text" id="kaufpreis" oninput="formatAndCalc(this)" class="w-full p-3 rounded-xl border"><span class="unit-label">€</span></div>
            </div>
            <div class="grid grid-cols-3 gap-2 mt-4">
                <div><label class="block text-sm">Baujahr</label><input type="text" id="baujahr" class="w-full p-3 rounded-xl border"></div>
                <div class="input-group"><label class="block text-sm">Preisspiegel</label><input type="text" id="preisspiegel" oninput="formatAndCalc(this)" class="w-full p-3 rounded-xl border"><span class="unit-label">€/m²</span></div>
                <div class="input-group"><label class="block text-sm">Mietspiegel</label><input type="text" id="mietspiegel" oninput="formatAndCalc(this)" class="w-full p-3 rounded-xl border"><span class="unit-label">€/m²</span></div>
            </div>
            <div class="grid grid-cols-3 gap-2 mt-4">
                <div><label class="block text-sm">Mietstatus</label><select id="mietstatus" onchange="calc()" class="w-full p-3 rounded-xl border"><option>vermietet</option><option>Leerstand</option></select></div>
                <div class="input-group"><label class="block text-sm">Wohnfläche</label><input type="text" id="wohnflaeche" oninput="formatAndCalc(this)" class="w-full p-3 rounded-xl border"><span class="unit-label">m²</span></div>
                <div class="input-group"><label class="block text-sm">Jahreskaltmiete</label><input type="text" id="jahreskaltmiete" oninput="formatAndCalc(this)" class="w-full p-3 rounded-xl border"><span class="unit-label">€</span></div>
            </div>
            <div class="grid grid-cols-2 gap-4 mt-4">
                <div class="input-group"><label class="block text-sm">Stellplätze & Garagen</label><input type="text" id="stellplaetze" oninput="formatAndCalc(this)" class="w-full p-3 rounded-xl border"><span class="unit-label">Stk.</span></div>
                <div class="input-group"><label class="block text-sm">Stellplatzmiete</label><input type="text" id="stellplatzmiete" oninput="formatAndCalc(this)" class="w-full p-3 rounded-xl border"><span class="unit-label">€ mtl.</span></div>
            </div>
        </div>

        <!-- REITER: ANSCHAFFUNGSKOSTEN -->
        <div id="tab-Anschaffungskosten" class="tab-content">
            <h2 class="text-lg font-bold mb-4">Grunderwerbssteuer</h2>
            <input type="range" id="steuer-range" min="3.5" max="6.5" step="0.5" value="3.5" class="w-full" oninput="updateRange('steuer', this.value)">
            <p class="text-center font-bold" id="steuer-val">3,5 %</p>
            
            <h2 class="text-lg font-bold mt-6 mb-4">Notar & Grundbuch</h2>
            <input type="range" id="notar-range" min="0" max="7.14" step="0.01" value="3.57" class="w-full" oninput="updateRange('notar', this.value)">
            <div class="flex justify-between text-xs text-gray-500">
                <span onclick="updateRange('notar', 0)" class="cursor-pointer font-bold">0%</span>
                <span onclick="updateRange('notar', 3.57)" class="cursor-pointer font-bold">3,57%</span>
                <span onclick="updateRange('notar', 7.14)" class="cursor-pointer font-bold">7,14%</span>
            </div>
            <p class="text-center font-bold" id="notar-val">3,57 %</p>
        </div>

        <div id="tab-Finanzierung" class="tab-content"><h2 class="text-xl font-bold">Finanzierung</h2></div>
        <div id="tab-Rendite" class="tab-content"><h2 class="text-xl font-bold">Rendite</h2></div>
    </main>

    <footer class="fixed bottom-0 w-full bg-blue-900 text-white p-4 z-50 text-xs">
        <div class="grid grid-cols-2 gap-2" id="res-grid">
            <!-- Dynamisch durch JS -->
        </div>
    </footer>

    <script>
        function updateRange(id, val) {
            // Konvertierung in String, um replace() sicher anwenden zu können
            let stringVal = String(val);
            document.getElementById(id + '-val').innerText = stringVal.replace('.', ',') + ' %';
            document.getElementById(id + '-range').value = val;
        }

        function formatAndCalc(input) {
            let val = input.value.replace(/\./g, '').replace(',', '.');
            if (!isNaN(val) && val !== '') input.value = new Intl.NumberFormat('de-DE').format(val);
            calc();
        }

        function calc() {
            const getV = (id) => parseFloat(document.getElementById(id).value.replace(/\./g, '').replace(',', '.')) || 0;
            const kp = getV('kaufpreis'), wf = getV('wohnflaeche'), ps = getV('preisspiegel'), ms = getV('mietspiegel'), 
                  jkm = getV('jahreskaltmiete'), stp = getV('stellplaetze'), stm = getV('stellplatzmiete');

            const kpm2 = wf > 0 ? (kp / wf) : 0;
            const psAbw = ps > 0 ? ((kpm2 / ps) - 1) * 100 : 0;
            const jkmGes = jkm + (stp * stm * 12);
            const msAbw = (ms * 12 * wf) > 0 ? ((jkm / (12 * wf)) / ms - 1) * 100 : 0;
            const bmr = kp > 0 ? (jkm / kp) * 100 : 0;
            const bmrStp = kp > 0 ? (jkmGes / kp) * 100 : 0;

            document.getElementById('res-grid').innerHTML = `
                <div>Kaufpreis/m²: <strong>${kpm2.toLocaleString('de-DE', {maximumFractionDigits:0})} €</strong></div>
                <div>Preisspiegel-Abw.: <strong>${psAbw.toFixed(1)} %</strong></div>
                <div>Jahreskaltmiete ges.: <strong>${jkmGes.toLocaleString('de-DE')} €</strong></div>
                <div>Mietspiegel-Abw.: <strong>${msAbw.toFixed(1)} %</strong></div>
                <div>Bruttomietrendite: <strong>${bmr.toFixed(2)} %</strong></div>
                <div>Rendite (inkl. Stellp.): <strong>${bmrStp.toFixed(2)} %</strong></div>
            `;
        }

        function showTab(t) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white');
                btn.classList.add('bg-gray-200');
                if(btn.innerText === t) {
                    btn.classList.add('bg-blue-600', 'text-white');
                    btn.classList.remove('bg-gray-200');
                }
            });
            const target = document.getElementById('tab-' + t);
            if(target) target.classList.add('active');
        }
        calc();
    </script>
</body>
</html>
